# =============================================================================
# Processing settings. Safe defaults; change only if you know why.
# =============================================================================

ocr:
  language: eng
  dpi: 300                    # Resolution used to read scanned pages.
  min_text_layer_chars: 50    # A page with fewer real text characters is treated as a scan.
  low_confidence: 60          # Below this OCR confidence (0-100) the tool retries with image clean-up.
  try_all_rotations_below: 45 # If still below this, all four orientations are tried.
  tesseract_path: ""          # Leave empty to auto-detect (bundled copy, PATH, Program Files).
  second_engine: true         # Second reader (RapidOCR, offline) for ID cards, photos and odd fonts.
  second_reading_below: 70    # Use it at once on scans below this quality; otherwise only when a value is missing.

processing:
  workers: 4                  # Parallel OCR workers. 0 = automatic (CPU cores - 2).
  supported_extensions: [".pdf", ".jpg", ".jpeg", ".png", ".tif", ".tiff", ".bmp", ".gif", ".webp", ".heic", ".docx", ".doc", ".rtf", ".odt", ".txt"]
  ignore_names: ["thumbs.db", "desktop.ini", ".ds_store"]
  max_file_mb: 200

confidence:
  auto_accept: 0.80           # At or above: document is labeled without review.
  review_below: 0.80          # Below: document goes to the human review queue.

verification:
  name_match_threshold: 85    # Fuzzy similarity (0-100) for names to count as the same.
  address_match_threshold: 90
  ssn_compare: full_or_last4  # Masked SSNs (XXX-XX-1234) are compared on the last 4 digits.

duplicates:
  detect: true
  auto_delete: false          # Never delete automatically. Duplicates go to the review queue.

output:
  run_folder_format: "run_%Y-%m-%d_%H%M%S"
  group_documents_by_person: true
  redact_personal_values: false   # true = mask names, DOB and addresses in the check sheet (for demos).
